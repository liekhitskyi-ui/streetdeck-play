.sd-survey { position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: rgba(20, 21, 24, 0.94); color: #e8e2d6; font: 16px/1.35 system-ui, -apple-system, sans-serif;
  touch-action: pan-y; -webkit-user-select: text; user-select: text;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
.sd-survey * { box-sizing: border-box; }
.sd-survey .sd-card { max-width: 420px; margin: 0 auto; }
.sd-survey h2 { margin: 4px 0 4px; font: bold 22px monospace; color: #ffd23f; letter-spacing: 1px; }
.sd-survey .sd-sub { margin: 0 0 14px; color: #a29d95; font-size: 14px; }
.sd-survey fieldset { border: 0; margin: 0 0 14px; padding: 0; }
.sd-survey legend { padding: 0; margin-bottom: 6px; font-weight: 600; }
.sd-survey .sd-row { display: flex; gap: 6px; }
.sd-survey .sd-row button { flex: 1; min-height: 44px; border: 2px solid #5a5f67; border-radius: 6px;
  background: #2b2d32; color: #e8e2d6; font: 600 15px system-ui, sans-serif; padding: 4px; }
.sd-survey .sd-row button[aria-pressed="true"] { border-color: #ffd23f; background: #4a4220; color: #ffd23f; }
.sd-survey .sd-ends { display: flex; justify-content: space-between; color: #a29d95; font-size: 12px; margin-top: 3px; }
.sd-survey textarea { width: 100%; min-height: 76px; font-size: 16px; border-radius: 6px; border: 2px solid #5a5f67;
  background: #2b2d32; color: #e8e2d6; padding: 8px; resize: vertical; }
.sd-survey .sd-actions { display: flex; gap: 8px; margin-top: 6px; }
.sd-survey .sd-actions button { flex: 1; min-height: 48px; border-radius: 6px; font: bold 15px monospace; }
.sd-survey .sd-send { background: #ffd23f; color: #141518; border: 0; }
